name: TrustBench CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/creator-studio/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/creator-studio
      - run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: creator-studio-dist
          path: apps/creator-studio/dist
